name: Build Telegram X APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "telegram.api_id=2040" >> local.properties
          echo "telegram.api_hash=b18441a1ed609e10d277d6ee1db7d74c" >> local.properties

      - name: Run Telegram X Setup Script
        run: |
          chmod +x scripts/setup.sh
          ./scripts/setup.sh --skip-sdk-setup || true

      - name: Fix google-services.json
        run: |
          sed -i 's/org.thunderdog.challegram/org.example.tgx/g' app/google-services.json

      - name: Build Debug APK
        run: ./gradlew assembleLatestUniversalDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g" -Dorg.gradle.workers.max=2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-X-Debug-APK
          path: app/build/outputs/apk/**/*.apk
