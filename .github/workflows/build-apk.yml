name: Build Telegram X

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "telegram.api_id=2496" >> local.properties
          echo "telegram.api_hash=8da85b0d5bfe62a52e5b04d173082afb" >> local.properties
          echo "tgx.extension=none" >> local.properties

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-X-APK
          path: app/build/outputs/apk/debug/*.apk
