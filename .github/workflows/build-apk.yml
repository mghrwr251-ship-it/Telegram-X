name: Build Telegram X APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Accept Android Licenses natively
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Configure Environment
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "telegram.api_id=2040" >> local.properties
          echo "telegram.api_hash=b18441a1ed609e10d277d6ee1db7d74c" >> local.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          echo "org.gradle.workers.max=2" >> gradle.properties
          echo "org.gradle.caching=false" >> gradle.properties

      - name: Run Telegram X Setup Script
        run: |
          chmod +x scripts/setup.sh
          ./scripts/setup.sh --skip-sdk-setup || true

      - name: Fix XML BOM Issue Safely
        run: |
          FILE="app/src/main/res/values/strings.xml"
          if [ -f "$FILE" ]; then
            # إزالة الرموز المخفية (BOM) من بداية الملف فقط
            sed -i '1s/^\xEF\xBB\xBF//' "$FILE"
          fi

      - name: Force Clean Google Services JSON
        run: |
          cat << 'EOF' > app/google-services.json
          {
            "project_info": { "project_number": "12345", "project_id": "tgx", "storage_bucket": "tgx" },
            "client": [ { "client_info": { "mobilesdk_app_id": "1:123:android:456", "android_client_info": { "package_name": "org.example.tgx" } }, "oauth_client": [], "api_key": [ { "current_key": "AIzaSyDummyKey" } ], "services": { "analytics_service": { "status": 1 }, "appinvite_service": { "status": 1 }, "ads_service": { "status": 1 } } } ],
            "configuration_version": "1"
          }
          EOF

      - name: Build Latest Universal Debug APK
        run: ./gradlew assembleLatestUniversalDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Telegram-X-Debug-APK
          path: app/build/outputs/apk/**/*.apk
