name: Build Telegram X APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: true

      - name: Fetch Git LFS Native Libraries
        run: git lfs pull

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Accept Android Licenses natively
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Run Telegram X Setup Script
        run: |
          chmod +x scripts/setup.sh
          ./scripts/setup.sh --skip-sdk-setup || true

      - name: Inject API Keys & Environment Configs
        run: |
          # حقن مفاتيح الـ API الخاصة بتليجرام في ملف الإعدادات
          BUILD_VARS_FILE=$(find . -name "BuildVars.java" -o -name "BuildVars.kt" | head -n 1)
          if [ -f "$BUILD_VARS_FILE" ]; then
            sed -i 's/APP_ID = [0-9]*;/APP_ID = 29741001;/g' "$BUILD_VARS_FILE"
            sed -i 's/APP_HASH = "[^"]*";/APP_HASH = "de12199e0e1a6c5еbаеs7cafb8fd336a";/g' "$BUILD_VARS_FILE"
            echo "Successfully injected API credentials into $BUILD_VARS_FILE"
          else
            echo "BuildVars file not found, skipping inline injection."
          fi

      - name: Change App Name to تلجرام فيلسوف عصري
        run: |
          # البحث عن ملفات strings.xml وتعديل اسم التطبيق الافتراضي
          find . -name "strings.xml" -print0 | while IFS= read -r -d '' file; do
            # البحث عن الوسم الذي يحتوي على اسم التطبيق وتعديله
            if grep -q "app_name" "$file"; then
              sed -i 's/<string name="app_name">[^<]*<\/string>/<string name="app_name">تلجرام فيلسوف عصري<\/string>/g' "$file"
              echo "Updated app name in $file"
            fi
          done

      - name: Build APK with Gradle
        run: |
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-X-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
