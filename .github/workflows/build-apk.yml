name: Build Telegram X APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup API Keys & Memory Fixes
        run: |
          # إضافة مفاتيح الـ API الخاصة بك
          echo "telegram.api_id=29741001" > local.properties
          echo "telegram.api_hash=de12199e0e1a6c5e6aec7cafb8fd336a" >> local.properties
          
          # حلول الذاكرة لمنع تعليق البناء
          echo "org.gradle.jvmargs=-Xmx4g" >> gradle.properties
          echo "android.enableAapt2Daemon=false" >> gradle.properties

      - name: Change App Name to "تلجرام فيلسوف عصري"
        run: |
          # تعديل الاسم في شاشة الترحيب وجميع اللغات
          find . -name "strings*.xml" -exec sed -i 's/تيليجرام X/تلجرام فيلسوف عصري/g' {} +
          find . -name "strings*.xml" -exec sed -i 's/Telegram X/تلجرام فيلسوف عصري/g' {} +

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build the APK
        run: ./gradlew assembleDebug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-X-Debug-APK
          path: app/build/outputs/apk/**/*.apk
