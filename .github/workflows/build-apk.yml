name: Build Telegram X APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: true

      - name: Fetch Git LFS Native Libraries
        run: git lfs pull

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Accept Android Licenses natively
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Run Telegram X Setup Script
        run: |
          chmod +x scripts/setup.sh
          ./scripts/setup.sh --skip-sdk-setup || true

      - name: Inject API Keys & Environment Configs
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "telegram.api_id=29741001" >> local.properties
          echo "telegram.api_hash=de12199e0e1a6c5e6aec7cafb8fd336a" >> local.properties
          
          # تمرير المفاتيح في gradle.properties
          echo "telegram.api_id=29741001" >> gradle.properties
          echo "telegram.api_hash=de12199e0e1a6c5e6aec7cafb8fd336a" >> gradle.properties
          
          # إعدادات الذاكرة والمعالج
          echo "org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m" >> gradle.properties
          echo "org.gradle.workers.max=1" >> gradle.properties
          echo "org.gradle.caching=false" >> gradle.properties

      - name: Safe App Name Override (UI & Strings Only)
        run: |
          # استبدال آمن يقتصر على ملفات الواجهات والنصوص فقط دون التعديل على الأكواد البرمجية
          find . -type f \( -name "strings*.xml" -o -name "AndroidManifest.xml" \) -exec sed -i 's/تيليجرام X/تلجرام فيلسوف عصري/g' {} +
          find . -type f \( -name "strings*.xml" -o -name "AndroidManifest.xml" \) -exec sed -i 's/Telegram X/تلجرام فيلسوف عصري/g' {} +
          find . -type f \( -name "strings*.xml" -o -name "AndroidManifest.xml" \) -exec sed -i 's/>Telegram</>تلجرام فيلسوف عصري</g' {} +

      - name: The Ultimate XML Sanitizer (Python)
        run: |
          python -c "
          import os, glob
          for filepath in glob.glob('app/src/main/res/**/*.xml', recursive=True):
              try:
                  with open(filepath, 'rb') as f:
                      data = f.read()
                  start_idx = data.find(b'<')
                  if start_idx > 0:
                      print(f'Sanitized: {filepath}')
                      with open(filepath, 'wb') as f:
                          f.write(data[start_idx:])
              except Exception as e:
                  pass
          "

      - name: Force Clean Google Services JSON
        run: |
          cat << 'EOF' > app/google-services.json
          {
            "project_info": { "project_number": "12345", "project_id": "tgx", "storage_bucket": "tgx" },
            "client": [ { "client_info": { "mobilesdk_app_id": "1:123:android:456", "android_client_info": { "package_name": "org.example.tgx" } }, "oauth_client": [], "api_key": [ { "current_key": "AIzaSyDummyKey" } ], "services": { "analytics_service": { "status": 1 }, "appinvite_service": { "status": 1 }, "ads_service": { "status": 1 } } } ],
            "configuration_version": "1"
          }
          EOF

      - name: Fast Pre-Flight Verification Check
        run: |
          echo "=== فحص توفر مفاتيح الاتصال ==="
          grep -q "telegram.api_id=29741001" local.properties || exit 1
          grep -q "telegram.api_hash=de12199e0e1a6c5e6aec7cafb8fd336a" local.properties || exit 1
          echo "=== فحص صحة الأوامر وهيكلية الملفات ==="
          ./gradlew assembleLatestUniversalDebug --dry-run

      - name: Build Latest Universal Debug APK
        run: ./gradlew assembleLatestUniversalDebug -Ptelegram.api_id=29741001 -Ptelegram.api_hash=de12199e0e1a6c5e6aec7cafb8fd336a --no-daemon --max-workers=1 --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Telegram-X-Debug-APK
          path: app/build/outputs/apk/**/*.apk
