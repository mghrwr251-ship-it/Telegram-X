name: Build Telegram X APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout Repository with Submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "telegram.api_id=2496" > local.properties
        echo "telegram.api_hash=8da85b0d5bfe62a52e5b04d173082afb" >> local.properties
        echo "tgx.extension=none" >> local.properties

    - name: Grant execute permissions to scripts
      run: |
        chmod +x gradlew
        if [ -f scripts/setup.sh ]; then
          chmod +x scripts/setup.sh
        fi

    - name: Run setup script if available
      run: |
        if [ -f scripts/setup.sh ]; then
          yes | ./scripts/setup.sh || true
        fi

    - name: Build APK (Universal Debug)
      run: ./gradlew assembleUniversalDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TelegramX-Universal-Debug-APK
        path: app/build/outputs/apk/**/*.apk
        retention-days: 7
