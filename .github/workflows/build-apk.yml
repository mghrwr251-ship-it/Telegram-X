name: Build Telegram X APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout Repository with Submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "telegram.api_id=2496" >> local.properties
        echo "telegram.api_hash=8da85b0d5bfe62a52e5b04d173082afb" >> local.properties
        echo "tgx.extension=none" >> local.properties

    - name: Add App ID Suffix for Coexistence
      run: |
        if [ -f app/build.gradle ]; then
          sed -i 's/applicationId "org.thunderdog.challegram"/applicationId "org.thunderdog.challegram.custom"/g' app/build.gradle
        elif [ -f app/build.gradle.kts ]; then
          sed -i 's/applicationId = "org.thunderdog.challegram"/applicationId = "org.thunderdog.challegram.custom"/g' app/build.gradle.kts
        fi

    - name: Grant execute permissions to scripts
      run: |
        chmod +x gradlew
        if [ -f scripts/setup.sh ]; then
          chmod +x scripts/setup.sh
        fi

    - name: Build APK (Universal Debug)
      run: ./gradlew assembleUniversalDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TelegramX-Universal-Debug-APK
        path: app/build/outputs/apk/**/*.apk
        retention-days: 7
