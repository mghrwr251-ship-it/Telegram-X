name: Build Telegram X APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: true

      - name: Fetch Git LFS Native Libraries
        run: git lfs pull

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Accept Android Licenses natively
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Run Telegram X Setup Script
        run: |
          chmod +x scripts/setup.sh
          ./scripts/setup.sh --skip-sdk-setup || true

      - name: Setup API Keys & Environment Configs
        run: |
          touch local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "telegram.api_id=29741001" >> local.properties
          echo "telegram.api_hash=de12199e0e1a6c5e6aec7cafb8fd336a" >> local.properties

      - name: Comprehensive App Renaming (All Languages)
        run: |
          # 1. استبدال اسم التطبيق app_name في كافة ملفات اللغات (strings.xml)
          find . -name "strings.xml" -type f -print0 | while IFS= read -r -d '' file; do
            sed -i -E 's/<string name="app_name"[^>]*>[^<]*<\/string>/<string name="app_name">تلجرام فيلسوف عصري<\/string>/g' "$file"
            sed -i -E 's/Telegram X/تلجرام فيلسوف عصري/g' "$file"
            sed -i -E 's/تيليجرام X/تلجرام فيلسوف عصري/g' "$file"
          done

          # 2. استبدال شامل لكافة نصوص الأكواد لضمان عدم ظهور الاسم القديم إطلاقاً
          find . \( -name "*.java" -o -name "*.kt" -o -name "*.xml" \) -type f -not -path "*/.git/*" -exec sed -i 's/Telegram X/تلجرام فيلسوف عصري/g' {} +
          find . \( -name "*.java" -o -name "*.kt" -o -name "*.xml" \) -type f -not -path "*/.git/*" -exec sed -i 's/تيليجرام X/تلجرام فيلسوف عصري/g' {} +

          echo "App name successfully updated and locked across all languages and files."

      - name: Build APK with Gradle
        run: |
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-X-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
