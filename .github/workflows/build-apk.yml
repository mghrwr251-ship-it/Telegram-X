name: Build Telegram X

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK Environment
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "telegram.api_id=2496" >> local.properties
          echo "telegram.api_hash=8da85b0d5bfe62a52e5b04d173082afb" >> local.properties
          echo "tgx.extension=none" >> local.properties

      - name: Bypass google-services checks
        run: |
          mkdir -p app
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "tgx-app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1234567890",
                  "android_client_info": {
                    "package_name": "org.example.tgx"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyD-fakekey"
                  }
                ]
              }
            ]
          }
          EOF

      - name: Apply App Branding (تلجرام فيلسوف عصري)
        run: |
          find . -name "strings.xml" -exec sed -i 's/>Telegram X</>تلجرام فيلسوف عصري</g' {} +

      - name: Build APK Cleanly
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Telegram X APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-X-Philosopher
          path: app/build/outputs/apk/**/*.apk
